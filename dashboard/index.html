        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;

            color: white;

                        url('https://images.unsplash.com/photo-1520975922284-9e0a6b9fbe7f');

            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* 🔥 efecto pro */
        }
        

        /* Pantallas */
        .pantalla {
            padding: 20px;
        }

        /* Ocultar */
        .oculto {
            display: none !important;
        }

        /* INICIO */
       #inicio {
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .contenedor {
            max-width: 1200px;
            margin: auto;
        }
        /* Título épico */
        .titulo {
            font-size: 60px;
            margin-bottom: 40px;
            color: #facc15;
            text-shadow: 
                0 0 10px rgba(250, 204, 21, 0.8),
                0 0 20px rgba(250, 204, 21, 0.6),
                0 0 40px rgba(250, 204, 21, 0.4);
        }

        /* Navbar */
        .navbar {
            display: flex;
            gap: 20px;
        }

        /* Botones dorados */
        .navbar button {
            font-size: 20px;
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #1e293b;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
            transition: all 0.2s ease;
        }

        .navbar button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.8);
        }

        /* Tablas */
       table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;

            background: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(6px);

            border: 1px solid #333;
            border-radius: 15px;
            overflow: hidden;

            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        th {
            background-color: #1a1a1a;
            color: #facc15;
            font-size: 18px;
        }

        td, th {
            padding: 12px;
            border-bottom: 1px solid #333;
            text-align: center;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        /* Ranking */
      

/* mismo estilo que el ranking original */
       .ranking-box {

            background: rgba(17, 17, 17, 0.85); /* 🔥 transparencia */
            backdrop-filter: blur(6px); /* 🔥 glass effect */

            border: 1px solid rgba(250, 204, 21, 0.2);

            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;

            box-shadow: 
                0 0 20px rgba(0,0,0,0.9),
                0 0 10px rgba(250, 204, 21, 0.1);
        }

/* título */
        .ranking-box h3 {
            color: #facc15;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }
/* lista */
        /* Listas y Items */
        .ranking-box ul { list-style: none; padding: 0; }
        .ranking-box li {
            padding: 12px 10px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #1a1a1a, #111);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem; /* Letra más grande */
        }

        .ranking-box li:first-child {
            border: 1px solid gold;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .ranking-box li:hover {
            background-color: #2a2a2a;
            transform: scale(1.02);
        }

    
        select {
            font-size: 18px;
            padding: 12px 20px;
            margin: 15px;
            border-radius: 10px;
            border: 1px solid #444;
            background-color: #111;
            color: #ccc;
            min-width: 200px;
            text-align: center;
            cursor: pointer;
        }

        /* cuando el usuario ya eligió algo */
        select:valid {
            color: white;
        }
        .filtro-botones button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 10px;
            border: none;

            background: linear-gradient(135deg, #facc15, #eab308);
            color: #1e293b;

            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
            transition: all 0.2s ease;
        }

        .filtro-botones button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.8);
        }
        .filtro {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 🏗️ ESTRUCTURA DASHBOARD */
       /* ESTO ORGANIZA EL DIBUJO QUE ME PASASTE */
       /* 🏗️ ESTRUCTURA DASHBOARD (FORZADA) */
        .grid-dashboard {
            display: grid;
            grid-template-columns: 1fr; /* Una columna en móvil */
            gap: 20px;
            margin-top: 20px;
            align-items: start;
        }

/* --- RESPONSIVE CELULAR (2 Columnas) --- */
        @media (max-width: 999px) {
            .grid-dashboard {
                display: grid;
                grid-template-columns: 1fr 1fr; /* 2 Columnas fijas */
                gap: 10px;
            }
    
            .subcol-stats {
                grid-column: 1 / span 2; /* Gráfico y porcentaje ocupan todo el ancho */
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .porcentaje-container {
                width: 100%;
                max-width: 280px;
                aspect-ratio: 1/1;
                margin: 0 auto;
            }
        }

        .grafico-container {
            width: 100%;
            min-height: 280px;
        }

            .porcentaje-container {
        /* Usamos Flex para centrar el contenido */
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
    /* ... tus otros estilos ... */
                border: 1px solid rgba(250, 204, 21, 0.4) !important;
                box-shadow: 0 0 20px rgba(250, 204, 21, 0.1), inset 0 0 15px rgba(250, 204, 21, 0.05) !important;

        /* 🔥 LA CLAVE DEL CUADRADO: Ancho y alto proporcionales */
                width: 350px !important;  /* Ancho fijo para el cuadrado */
                height: 350px !important; /* Alto fijo (cuadrado) */
        
        /* Margen automático para centrarlo si sobra espacio a los lados */
                margin: 0 auto; 
            }

            }
    

/* --- ESTILO DE LAS CAJAS --- */
        .ranking-box {
            background: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(6px);

            color: #facc15;
            text-align: center;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }

        .btn-moderno {
            background: linear-gradient(135deg, #444, #222);
            border: 1px solid #666;
            color: #eee;
            padding: 8px 25px;
            border-radius: 50px; /* Forma de píldora */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);

        .btn-moderno:hover {
            background: linear-gradient(135deg, #ee9d07, #333);

/* --- DISEÑO PARA PC (ESCRITORIO) --- */

function esNombreValido(nombre) {
    if (!nombre) return false;

    nombre = nombre.trim().toLowerCase();

    // ❌ lista negra
    if (nombresInvalidos.includes(nombre)) return false;

    // ❌ muy corto
    if (nombre.length < 3) return false;

    // ❌ tiene números
    if (/\d/.test(nombre)) return false;

    // ❌ demasiadas palabras (ruido OCR)
    if (nombre.split(" ").length > 6) return false;

    return true;
}

function limpiarTexto(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "") // quitar acentos
        .replace(/["']/g, "")            // 🔥 quitar comillas
        .replace(/\s+/g, "")             // quitar espacios
        .trim();
}

function normalizarNombre(nombre) {
    const limpio = limpiarTexto(nombre);

    return nombreMap[limpio] || limpio;
}
function capitalizarNombre(nombre) {
    return nombre
        .split(" ")
        .map(p => p.charAt(0).toUpperCase() + p.slice(1))
        .join(" ");
}
function normalizarCofre(nombreCofre) {
    if (!nombreCofre) return "Desconocido";
    
    // 1. Limpieza básica (quita comillas, acentos, etc)
    const limpio = limpiarTexto(nombreCofre); 
    
    // 2. Busca en tu mapa (ej: "ascensodelosantiguos" -> "Evento Ascenso de los Antiguos")
    return cofreMap[limpio] || limpio; 
}

            .sort((a, b) => a - b);

        semanas.forEach(s => {

            semanaSelect.appendChild(opt1);

            opt2.value = s;
            opt2.textContent = `Semana ${s}`;
            semanaClanSelect.appendChild(opt2);
        });

    // 🔹 EVENTOS

function rankingClan(semana) {
    const ranking = {};
    // Convertimos la semana del select a número para que la comparación sea real
    const semanaNum = semana === "Todas" ? "Todas" : Number(semana);

    datos.forEach(d => {
        if (semanaNum !== "Todas" && d.semanaCalc !== semanaNum) return;

        // Usamos tu función normalizarCofre que ya es robusta
        let cofreOficial = normalizarCofre(d.Cofre);
        let puntos = valoresCofre[cofreOficial] || 0;

        ranking[d.Jugador] = (ranking[d.Jugador] || 0) + puntos;
    });

    return Object.entries(ranking).sort((a, b) => b[1] - a[1]);
}

function mostrarRankingDiario() {
    const lista = document.getElementById("rankingDiario");

    if (!semanaSeleccionada) return;

    const semanaNum = semanaSeleccionada === "Todas" ? "Todas" : Number(semanaSeleccionada);
    let puntosPorJugador = {};

    datos.forEach(registro => {
    if (semanaNum !== "Todas" && registro.semanaCalc !== semanaNum) return;

    let nombreLimpio = limpiarTexto(registro.Cofre);

    // 1. Definimos si es un cofre de "Evento" (Excepciones)
    let esEvento = nombreLimpio.includes("tartaro");

    // 2. Definimos si es un cofre "Diario" 
    // Solo contamos como diario si cumple las palabras clave Y NO es un evento
    if (!esEvento && (
        nombreLimpio.includes("arena") ||
        nombreLimpio.includes("cripta") ||
        nombreLimpio.includes("ciudad")
    )) {
        let jugador = registro.Jugador || "Desconocido";
        puntosPorJugador[jugador] = (puntosPorJugador[jugador] || 0) + 1;
    }
});

    let ranking = Object.entries(puntosPorJugador).sort((a, b) => b[1] - a[1]);

    ranking.forEach(jugador => {
        const li = document.createElement("li");
        const nombre = jugador[0];
        const cantidad = jugador[1];

        li.innerHTML = `<span>${nombre}</span> <span>${cantidad} cofres</span>`;

        if (cantidad >= 70) {

    });
}


function dibujarGraficoActividad() {
    const canvas = document.getElementById('graficoDiario');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const semanaSeleccionada = document.getElementById("semanaClan").value;
    const semanaNum = semanaSeleccionada === "Todas" ? "Todas" : Number(semanaSeleccionada);

    // 1. Filtrar los datos por la semana que elegiste
    const filtrados = datos.filter(d => 
        semanaNum === "Todas" || d.semanaCalc === semanaNum
    );

    // 2. Contar cofres por día
    const conteo = {};
    filtrados.forEach(d => {
        const fecha = d.Fecha.split(" ")[0]; // Extrae YYYY-MM-DD
        conteo[fecha] = (conteo[fecha] || 0) + 1;
    });

    // 3. Ordenar fechas y preparar etiquetas
    const labels = Object.keys(conteo).sort();
    const valores = labels.map(f => conteo[f]);

    // 4. Destruir gráfico anterior si existe
    if (miGrafico) miGrafico.destroy();

    // 5. Dibujar
    miGrafico = new Chart(ctx, {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Cofres por día",
                data: valores,
                backgroundColor: "rgba(255, 215, 0, 0.6)", // Dorado transparente
                borderColor: "rgba(255, 215, 0, 1)",
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true, ticks: { color: "#fff" } },
                x: { ticks: { color: "#fff" } }
            },
            plugins: {
                legend: { labels: { color: "#fff" } }
            }
        }
    });
}
function calcularParticipacionEvento(semana) {
    const elementoPorcentaje = document.getElementById("porcentajeEvento");
    const elementoDetalle = document.getElementById("detalleParticipacion");
    if (!elementoPorcentaje) return;

    const semanaNum = (semana === "Todas" || !semana) ? "Todas" : Number(semana);

    // 1. Total de miembros únicos en esa semana
    const todosLosJugadoresSemana = datos.filter(d => 
        semanaNum === "Todas" || d.semanaCalc === semanaNum
    );
    const totalMiembrosReales = [...new Set(todosLosJugadoresSemana.map(d => d.Jugador))].length;

    // 2. Participantes del evento
    const registrosEvento = todosLosJugadoresSemana.filter(d => {
        const nombreCofre = d.Cofre ? d.Cofre.toLowerCase() : "";
        return nombreCofre.includes("ascenso");
    });
    const participantesEvento = [...new Set(registrosEvento.map(r => r.Jugador))].length;

    // 3. Cálculo
    let porcentaje = totalMiembrosReales > 0 ? Math.round((participantesEvento / totalMiembrosReales) * 100) : 0;

    // 4. Mostrar Datos
    elementoPorcentaje.textContent = `${porcentaje}%`;
    
    // Mostramos el "X de Y miembros"
    if (elementoDetalle) {
        elementoDetalle.textContent = `${participantesEvento} de ${totalMiembrosReales} miembros activos`;
    }

    // Colores Glow
    if (porcentaje >= 90) {
        elementoPorcentaje.style.color = "#47ff78";
    } else if (porcentaje >= 60) {
        elementoPorcentaje.style.color = "#facc15";
    } else {
        elementoPorcentaje.style.color = "#ff4747";
    }
}
